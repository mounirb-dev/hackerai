# Docker Compose Override for Local Testing
services:
  app:
    ports:
      - "3100:3000"
    networks:
      - default
      - dokploy-network
      - trigger-webapp
    volumes:
      - trigger-credentials:/run/trigger:ro
  trigger-bootstrap:
    environment:
      TRIGGER_POSTGRES_PASSWORD: ${TRIGGER_POSTGRES_PASSWORD:-}
    volumes:
      - trigger-credentials:/run/trigger
  postgres:
    ports:
      - "5433:5432"
  convex:
    ports:
      - "3210:3210"
  garage:
    ports:
      - "3900:3900"
      - "3903:3903"

volumes:
  trigger-credentials:

networks:
  trigger-webapp:
    external: true
    name: webapp
