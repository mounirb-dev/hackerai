# Dokploy template: HackerAI + Ollama + restricted Docker sandbox runtime.

[variables]
main_domain = "${domain}"
workos_cookie_password = "${base64:32}"
convex_service_role_key = "${base64:32}"
account_identity_hmac_secret = "${base64:32}"

[config]
[[config.domains]]
serviceName = "app"
port = 3000
host = "${main_domain}"

[config.env]
NEXT_PUBLIC_BASE_URL = "https://${main_domain}"
NEXT_PUBLIC_WORKOS_REDIRECT_URI = "https://${main_domain}/callback"
WORKOS_COOKIE_PASSWORD = "${workos_cookie_password}"
CONVEX_SERVICE_ROLE_KEY = "${convex_service_role_key}"
ACCOUNT_IDENTITY_HMAC_SECRET = "${account_identity_hmac_secret}"
# Fill these in after deploying (see README.md):
NEXT_PUBLIC_CONVEX_URL = ""
WORKOS_API_KEY = ""
WORKOS_CLIENT_ID = ""
AWS_S3_ACCESS_KEY_ID = ""
AWS_S3_SECRET_ACCESS_KEY = ""
AWS_S3_BUCKET_NAME = ""
AWS_S3_REGION = "us-east-1"
OLLAMA_MODEL = "qwen3:8b"
OLLAMA_VISION = "false"
DOCKER_SANDBOX_IMAGE = "hackerai/sandbox:latest"
SANDBOX_MEMORY_MB = "2048"
SANDBOX_CPUS = "2"
SANDBOX_IDLE_TIMEOUT_SECONDS = "1800"
