# Dokploy template: HackerAI fully self-hosted
# (app + built-in auth, Postgres, Convex, Garage S3, Docker sandbox runtime).

[variables]
main_domain = "${domain}"
convex_domain = "${domain}"
s3_domain = "${domain}"
trigger_domain = "${domain}"
postgres_password = "${password:32}"
convex_service_role_key = "${password:48}"
account_identity_hmac_secret = "${base64:32}"
# Must be 64 hex characters (openssl rand -hex 32).
convex_instance_secret = "${hash:64}"
garage_rpc_secret = "${hash:64}"
garage_admin_token = "${password:48}"
s3_secret_seed = "${password:48}"
trigger_postgres_password = "${password:32}"
trigger_clickhouse_password = "${password:32}"
trigger_object_store_secret = "${password:32}"
trigger_session_secret = "${hash:32}"
trigger_magic_link_secret = "${hash:32}"
trigger_encryption_key = "${hash:32}"
trigger_provider_secret = "${hash:32}"
trigger_coordinator_secret = "${hash:32}"
trigger_managed_worker_secret = "${hash:32}"
trigger_cli_token = "tr_pat_${hash:40}"
redis_rest_token = "${password:32}"
trigger_bootstrap_email = "${email}"
trigger_bootstrap_project_name = "HackerAI Agent"
# These are the only operator-provided values in the template.
ollama_base_url = ""
ollama_api_key = ""

[config]
[[config.domains]]
serviceName = "app"
port = 3000
host = "${main_domain}"

[[config.domains]]
serviceName = "convex"
port = 3210
host = "${convex_domain}"

[[config.domains]]
serviceName = "garage"
port = 3900
host = "${s3_domain}"

[[config.domains]]
serviceName = "trigger-webapp"
port = 3000
host = "${trigger_domain}"

[config.env]
NEXT_PUBLIC_BASE_URL = "https://${main_domain}"
NEXT_PUBLIC_CONVEX_URL = "https://${convex_domain}"
AWS_S3_ENDPOINT = "https://${s3_domain}"
AWS_S3_BUCKET_NAME = "hackerai"
POSTGRES_PASSWORD = "${postgres_password}"
CONVEX_SERVICE_ROLE_KEY = "${convex_service_role_key}"
CONVEX_INSTANCE_SECRET = "${convex_instance_secret}"
ACCOUNT_IDENTITY_HMAC_SECRET = "${account_identity_hmac_secret}"
GARAGE_RPC_SECRET = "${garage_rpc_secret}"
GARAGE_ADMIN_TOKEN = "${garage_admin_token}"
S3_SECRET_SEED = "${s3_secret_seed}"
AUTH_ALLOW_SIGNUPS = true
SELFHOST_ENTITLEMENTS = "ultra-plan"
# The remote Ollama URL and key are intentionally the only manual inputs.
OLLAMA_BASE_URL = "${ollama_base_url}"
OLLAMA_API_KEY = "${ollama_api_key}"
OLLAMA_MODEL = "qwen3:4b"
OLLAMA_VISION = false
COMPOSE_PROFILES = ""
DOCKER_SANDBOX_IMAGE = "hackerai/sandbox:latest"
SANDBOX_MEMORY_MB = 2048
SANDBOX_CPUS = 1
SANDBOX_IDLE_TIMEOUT_SECONDS = 900
TRIGGER_PUBLIC_URL = "https://${trigger_domain}"
TRIGGER_POSTGRES_PASSWORD = "${trigger_postgres_password}"
TRIGGER_CLICKHOUSE_PASSWORD = "${trigger_clickhouse_password}"
TRIGGER_OBJECT_STORE_SECRET = "${trigger_object_store_secret}"
TRIGGER_SESSION_SECRET = "${trigger_session_secret}"
TRIGGER_MAGIC_LINK_SECRET = "${trigger_magic_link_secret}"
TRIGGER_ENCRYPTION_KEY = "${trigger_encryption_key}"
TRIGGER_PROVIDER_SECRET = "${trigger_provider_secret}"
TRIGGER_COORDINATOR_SECRET = "${trigger_coordinator_secret}"
TRIGGER_MANAGED_WORKER_SECRET = "${trigger_managed_worker_secret}"
TRIGGER_CLI_TOKEN = "${trigger_cli_token}"
REDIS_REST_TOKEN = "${redis_rest_token}"
TRIGGER_BOOTSTRAP_EMAIL = "${trigger_bootstrap_email}"
TRIGGER_BOOTSTRAP_PROJECT_NAME = "${trigger_bootstrap_project_name}"
HACKERAI_BUILD_CONTEXT = "https://github.com/mounirb-dev/hackerai.git"
